<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero 背景选型 · Rust 道场</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #07090d; color: #fff8ed; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  section { position: relative; min-height: 100vh; display: flex; align-items: center; overflow: hidden; border-bottom: 1px solid #2a2f3a; }
  section img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .inner { position: relative; z-index: 1; padding: 6vw; width: 100%; }
  .chip { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: .22em; font-weight: 800; background: #b0490f; color: #fff; padding: 8px 14px; }
  .name { display: inline-block; margin-left: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: .22em; color: #c9c1b6; }
  h1 { margin-top: 28px; font-size: clamp(3.2rem, 11vw, 9rem); line-height: .9; font-weight: 900; letter-spacing: -0.02em; }
  p.sub { margin-top: 22px; font-size: clamp(1rem, 1.6vw, 1.4rem); color: #e6ded2; max-width: 34em; }
  .cta { display: inline-block; margin-top: 30px; background: #b0490f; color: #fff; font-weight: 700; padding: 14px 26px; text-decoration: none; }
  .hint { position: fixed; right: 16px; bottom: 14px; z-index: 9; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #8d938f; background: rgba(7,9,13,.8); border: 1px solid #2a2f3a; padding: 6px 10px; }
</style>
</head>
<body>
  <div class="hint">↓ 滚动对比 A / B / C / D</div>

  <section>
    <img class="bg" src="hero-a.webp" alt="">
    <div class="inner">
      <span class="chip">A</span><span class="name">RUSTED METAL · 铁锈钢板</span>
      <h1>Rust 道场</h1>
      <p class="sub">从 0 到生产级后端，按 2026 真实招聘需求设计。</p>
      <a class="cta" href="#">开始学习</a>
    </div>
  </section>

  <section>
    <img class="bg" src="hero-b.webp" alt="">
    <div class="inner">
      <span class="chip">B</span><span class="name">BLUEPRINT · 工程蓝图</span>
      <h1>Rust 道场</h1>
      <p class="sub">从 0 到生产级后端，按 2026 真实招聘需求设计。</p>
      <a class="cta" href="#">开始学习</a>
    </div>
  </section>

  <section>
    <img class="bg" src="hero-c.webp" alt="">
    <div class="inner">
      <span class="chip">C</span><span class="name">FORGE · 锻炉余烬</span>
      <h1>Rust 道场</h1>
      <p class="sub">从 0 到生产级后端，按 2026 真实招聘需求设计。</p>
      <a class="cta" href="#">开始学习</a>
    </div>
  </section>

  <section>
    <img class="bg" src="hero-d.webp" alt="">
    <div class="inner">
      <span class="chip">D</span><span class="name">PARTICLE TOPOLOGY · 粒子等高线</span>
      <h1>Rust 道场</h1>
      <p class="sub">从 0 到生产级后端，按 2026 真实招聘需求设计。</p>
      <a class="cta" href="#">开始学习</a>
    </div>
  </section>
</body>
</html>
