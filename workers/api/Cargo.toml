[package]
name = "rust-dojo-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
askama = "0.14"
pulldown-cmark = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.6", features = ["d1"] }
# worker-build 0.1 is the compatible toolchain for worker 0.6 and uses this exact bindgen schema.
wasm-bindgen = "=0.2.105"
