{% extends "base.html" %}

{% block content %}
<main class="flex min-h-[calc(100svh-58px)] items-center justify-center bg-bg px-4 py-16 sm:px-6 lg:px-8">
  <section class="w-full max-w-2xl border border-line bg-panel p-8 text-center shadow-card sm:p-12">
    <p class="text-xs font-black uppercase tracking-[0.24em] text-brand">404 / NOT FOUND</p>
    <h1 class="mt-5 text-4xl font-black leading-tight text-fg sm:text-6xl">页面不存在</h1>
    <p class="mt-5 text-base leading-7 text-fg2">你访问的页面可能已移动，或链接地址有误。</p>
    <a href="/" class="mt-8 inline-flex items-center bg-brand px-5 py-3 text-sm font-bold text-white transition-colors hover:bg-brand-hover">返回首页</a>
  </section>
</main>
{% endblock %}
