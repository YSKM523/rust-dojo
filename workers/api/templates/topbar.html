<header class="sticky top-0 z-20 flex h-[58px] items-center gap-4 border-b border-line/80 bg-panel/90 px-4 backdrop-blur-xl">
  <a href="/" class="flex shrink-0 items-center gap-2 font-extrabold tracking-tight text-fg">
    <span class="flex h-7 w-7 items-center justify-center rounded bg-[#15181d] text-brand shadow-card">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-terminal" aria-hidden="true"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg>
    </span>
    Rust 道场
  </a>
  <nav class="flex h-full min-w-0 items-center gap-3 overflow-x-auto">
    <a href="/learn" class="flex h-full shrink-0 items-center text-[13px] font-medium tracking-wide transition-colors text-fg2 hover:text-fg">学习路线图</a>
    <a href="/resources" class="flex h-full shrink-0 items-center text-[13px] font-medium tracking-wide transition-colors font-semibold text-fg [box-shadow:inset_0_-2px_0_var(--brand)]">资料库</a>
    <a href="/me" class="flex h-full shrink-0 items-center text-[13px] font-medium tracking-wide transition-colors text-fg2 hover:text-fg">我的足迹</a>
  </nav>
  <div class="flex-1"></div>
  <button data-island="theme-toggle" aria-label="切换深浅色" class="flex h-8 w-8 items-center justify-center rounded-md border border-line text-fg2 hover:text-fg">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon theme-icon-moon" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun theme-icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
  </button>
  {% if authenticated %}
  <div class="flex items-center gap-3 text-sm">
    <span class="text-fg2">{{ user_email }}</span>
    <button data-island="logout" class="rounded border border-line bg-panel2 px-2.5 py-1 text-fg2 transition-colors hover:text-fg">退出</button>
  </div>
  {% else %}
  <a href="/login" class="shrink-0 rounded bg-brand px-3.5 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-brand-hover">登录</a>
  {% endif %}
</header>
